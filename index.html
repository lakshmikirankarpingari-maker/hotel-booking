<!DOCTYPE html>
<html>
<head>
  <title>Sai Lakshmi Residency</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-100">

<!-- LOGIN -->
<div id="loginPage" class="min-h-screen flex items-center justify-center">
  <div class="bg-white p-6 rounded-2xl shadow w-80">
    <h2 class="text-xl font-bold mb-4 text-center">Login</h2>
    <input id="email" placeholder="Email" class="w-full mb-3 p-2 border rounded">
    <input id="password" type="password" placeholder="Password" class="w-full mb-3 p-2 border rounded">
    <button onclick="login()" class="w-full bg-blue-600 text-white p-2 rounded-xl">Login</button>
    <button onclick="signup()" class="w-full mt-2 bg-gray-200 p-2 rounded-xl">Signup</button>
  </div>
</div>

<!-- APP -->
<div id="appPage" class="hidden">

<!-- HEADER -->
<div class="flex justify-between p-4">
  <h2 class="font-bold">Home</h2>
  <button onclick="logout()" class="text-red-500">Logout</button>
</div>

<!-- USER UI -->
<div id="userUI" class="px-4">

<!-- HOTEL -->
<div class="bg-white rounded-3xl shadow overflow-hidden">
  <img src="https://images.unsplash.com/photo-1566073771259-6a8506099945"
       class="w-full h-56 object-cover">
  <div class="p-4 flex justify-between">
    <div>
      <h3 class="font-bold">Sai Lakshmi Residency</h3>
      <p class="text-sm text-gray-500">Muthukur</p>
    </div>
    <a href="tel:7337233878">📞</a>
  </div>
</div>

<!-- ROOM SELECTION -->
<div class="mt-4">
  <h3 class="font-bold mb-2">Select Room</h3>

  <div class="grid grid-cols-2 gap-3">

    <div onclick="selectRoom('Standard')" id="roomStandard"
      class="bg-white p-3 rounded-xl shadow cursor-pointer">
      <img src="https://images.unsplash.com/photo-1590490360182-c33d57733427"
           class="h-24 w-full object-cover rounded">
      <p class="font-bold mt-1">Standard</p>
      <p class="text-sm text-gray-500">₹800</p>
    </div>

    <div onclick="selectRoom('Deluxe')" id="roomDeluxe"
      class="bg-white p-3 rounded-xl shadow cursor-pointer">
      <img src="https://images.unsplash.com/photo-1611892440504-42a792e24d32"
           class="h-24 w-full object-cover rounded">
      <p class="font-bold mt-1">Deluxe</p>
      <p class="text-sm text-gray-500">₹1200</p>
    </div>

  </div>
</div>

<!-- FORM -->
<div class="bg-white mt-4 p-4 rounded-xl shadow">
  <p id="selectedRoomText" class="mb-2 text-blue-600 font-semibold">No room selected</p>

  <input type="date" id="checkIn" class="w-full mb-2 p-2 border rounded">
  <input type="date" id="checkOut" class="w-full mb-2 p-2 border rounded">

  <input id="name" placeholder="Name" class="w-full mb-2 p-2 border rounded">
  <input id="phone" placeholder="Phone" class="w-full mb-2 p-2 border rounded">

  <button onclick="confirmBooking()" class="w-full bg-blue-600 text-white p-3 rounded-xl">
    Confirm Booking
  </button>

  <div id="bookingStatus" class="text-center mt-2 font-semibold"></div>
</div>

<!-- BOOKINGS -->
<div class="mt-4">
  <h3 class="font-bold">My Bookings</h3>
  <div id="myBookings"></div>
</div>

</div>

<!-- ADMIN -->
<div id="adminPanel" class="hidden p-4">
  <h2 class="font-bold">Admin Dashboard</h2>
  <div id="allBookings"></div>
</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDs14OWNMCeO9h7u2MD6tz7TBG2IHKfZU0",
  authDomain: "hotel-booking-3b5ce.firebaseapp.com",
  projectId: "hotel-booking-3b5ce"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const OWNER_EMAIL = "lakshmikirankarpingari@gmail.com";
const OWNER_WHATSAPP = "917337233878";

let selectedRoom = "";

/* AUTH */
auth.onAuthStateChanged(user=>{
  if(user){
    loginPage.style.display="none";
    appPage.classList.remove("hidden");

    if(user.email === OWNER_EMAIL){
      userUI.style.display="none";
      adminPanel.classList.remove("hidden");
      loadAllBookings();
    } else {
      userUI.style.display="block";
      adminPanel.classList.add("hidden");
      loadMyBookings();
    }
  } else {
    loginPage.style.display="flex";
    appPage.classList.add("hidden");
  }
});

/* LOGIN */
function login(){
  auth.signInWithEmailAndPassword(
    document.getElementById("email").value.trim(),
    document.getElementById("password").value.trim()
  ).catch(e=>alert(e.message));
}

function signup(){
  auth.createUserWithEmailAndPassword(
    document.getElementById("email").value.trim(),
    document.getElementById("password").value.trim()
  ).catch(e=>alert(e.message));
}

function logout(){
  auth.signOut();
}

/* SELECT ROOM */
function selectRoom(room){
  selectedRoom = room;

  document.getElementById("selectedRoomText").innerText = "Selected: " + room;

  document.getElementById("roomStandard").classList.remove("border-2","border-blue-600");
  document.getElementById("roomDeluxe").classList.remove("border-2","border-blue-600");

  if(room === "Standard"){
    document.getElementById("roomStandard").classList.add("border-2","border-blue-600");
  } else {
    document.getElementById("roomDeluxe").classList.add("border-2","border-blue-600");
  }
}

/* CONFIRM BOOKING */
function confirmBooking(){

  const userName = document.getElementById("name").value.trim();
  const userPhone = document.getElementById("phone").value.trim();
  const checkInDate = document.getElementById("checkIn").value;
  const checkOutDate = document.getElementById("checkOut").value;

  if(selectedRoom === "" || userName === "" || userPhone === "" || checkInDate === "" || checkOutDate === ""){
    alert("Please fill all details and select a room");
    return;
  }

  db.collection("bookings").add({
    userId: auth.currentUser.uid,
    room: selectedRoom,
    name: userName,
    phone: userPhone,
    checkIn: checkInDate,
    checkOut: checkOutDate,
    status:"pending"
  }).then(()=>{

    document.getElementById("bookingStatus").innerText = "✅ Booking Sent";

    const msg = `🏨 New Booking
Name: ${userName}
Room: ${selectedRoom}
Check-in: ${checkInDate}
Check-out: ${checkOutDate}
Phone: ${userPhone}`;

    window.open(`https://wa.me/${OWNER_WHATSAPP}?text=${encodeURIComponent(msg)}`);

    // reset form
    selectedRoom = "";
    document.getElementById("selectedRoomText").innerText = "No room selected";
    document.getElementById("name").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("checkIn").value = "";
    document.getElementById("checkOut").value = "";

    document.getElementById("roomStandard").classList.remove("border-2","border-blue-600");
    document.getElementById("roomDeluxe").classList.remove("border-2","border-blue-600");
  });
}

/* USER BOOKINGS */
function loadMyBookings(){
  db.collection("bookings")
  .where("userId","==",auth.currentUser.uid)
  .onSnapshot(s=>{
    let h="";
    s.forEach(d=>{
      let data=d.data();
      let color = data.status==="accepted"?"green":data.status==="rejected"?"red":"orange";

      h+=`<div class="bg-white p-2 mb-2 rounded shadow">
        ${data.room}
        <span style="color:${color}; font-weight:bold">${data.status}</span>
      </div>`;
    });
    document.getElementById("myBookings").innerHTML=h;
  });
}

/* ADMIN */
function loadAllBookings(){
  db.collection("bookings").onSnapshot(s=>{
    let h="";
    s.forEach(d=>{
      let data=d.data();
      h+=`<div class="bg-white p-2 mb-2 rounded shadow">
        ${data.name} - ${data.room} - ${data.status}
        <button onclick="accept('${d.id}')">✔</button>
        <button onclick="reject('${d.id}')">✖</button>
      </div>`;
    });
    document.getElementById("allBookings").innerHTML=h;
  });
}

function accept(id){ db.collection("bookings").doc(id).update({status:"accepted"}); }
function reject(id){ db.collection("bookings").doc(id).update({status:"rejected"}); }

</script>

</body>
</html>
