<!DOCTYPE html>
<html>
<head>
  <title>Sai Lakshmi Residency</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gradient-to-br from-blue-100 to-purple-200">

<!-- LOADING -->
<div id="loading" class="fixed inset-0 bg-white flex items-center justify-center hidden">
  <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-500"></div>
</div>

<!-- LOGIN -->
<div id="loginPage" class="min-h-screen flex items-center justify-center">
  <div class="bg-white p-6 rounded-xl shadow w-80">
    <h2 class="text-xl font-bold mb-4 text-center">Login / Signup</h2>

    <input id="email" placeholder="Email" class="w-full mb-3 p-2 border rounded">
    <input id="password" type="password" placeholder="Password" class="w-full mb-3 p-2 border rounded">

    <button onclick="login()" class="w-full bg-blue-500 text-white p-2 rounded mb-2">Login</button>
    <button onclick="signup()" class="w-full bg-green-500 text-white p-2 rounded">Signup</button>
  </div>
</div>

<!-- APP -->
<div id="appPage" style="display:none;">

  <!-- HERO -->
  <div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-6 text-center">
    <h1 class="text-3xl font-bold">🏨 Sai Lakshmi Residency</h1>
    <p>Muthukur Rd, Andhra Pradesh</p>
    <p class="text-sm mt-2">Clean • Hygienic • Family Friendly • 24x7 Hot Water</p>
  </div>

  <!-- ROOMS -->
  <div class="p-6 grid grid-cols-1 md:grid-cols-3 gap-4">

    <div class="bg-white rounded-xl shadow">
      <img src="https://lh3.googleusercontent.com/gps-cs-s/ANWiy9R5fqddFZ39svHGo1EondlVwCR-WzgRxu46HRzw9UemkL2Cktk4oXfhV43pG1z2P253SRs3CqiGXFADFEElTAjsSzjjT3nPy6ixl-K_I9Sazw2oelQiVjOfx85OzjvYOV7RF3yfLk3zoxjx=w224-h298-k-no" class="rounded-t-xl w-full h-40 object-cover">
      <div class="p-4">
        <h3 class="font-bold">Standard Room</h3>
        <p>Affordable & clean</p>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow">
      <img src="https://lh3.googleusercontent.com/gps-cs-s/ANWiy9TKJ48pRFGTIpgv54C4tzTMNDA5fkQfL3ygOPXrs-1MipNj7NbjSj7sBJmkEMy2-VJKWBpkknxX9Riw2LIhp09AEH7ItTa_25nW4r64GBXDWkQrMEVu4iMSDK78Iso5WjyKilLJkQ=w529-h298-k-no" class="rounded-t-xl w-full h-40 object-cover">
      <div class="p-4">
        <h3 class="font-bold">Deluxe Room</h3>
        <p>Comfort + AC</p>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow">
      <img src="https://lh3.googleusercontent.com/gps-cs-s/ANWiy9QEduP6qA02traW8-8ctOFCmJYtFiLmHFrnE9pxyrcanwo5-ga9E6ZWZy8o4UMfYQ7_8Dj_IyznXiKDdrcvmzffZbGJ8yi6NkhJDyppx3i17bEU9QPWigB1dm_H1cvYxPreVMyv=w224-h397-k-no" class="rounded-t-xl w-full h-40 object-cover">
      <div class="p-4">
        <h3 class="font-bold">Suite</h3>
        <p>Premium experience</p>
      </div>
    </div>

  </div>

  <!-- BOOKING (USER ONLY) -->
  <div id="bookingSection" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow">
    <h2 class="text-xl font-bold mb-4 text-center">Book Your Stay</h2>

    <input id="name" placeholder="Name" class="w-full mb-3 p-2 border rounded">
    <select id="room" class="w-full mb-3 p-2 border rounded">
      <option value="">Select Room</option>
      <option>Standard</option>
      <option>Deluxe</option>
      <option>Suite</option>
    </select>

    <input type="date" id="checkIn" class="w-full mb-3 p-2 border rounded">
    <input type="date" id="checkOut" class="w-full mb-3 p-2 border rounded">

    <button onclick="bookRoom()" class="w-full bg-blue-600 text-white p-2 rounded">Book Now</button>
    <button onclick="logout()" class="w-full mt-3 bg-red-500 text-white p-2 rounded">Logout</button>
  </div>

  <!-- USER BOOKINGS -->
  <div id="userBookingsSection" class="max-w-md mx-auto mt-6">
    <h3 class="text-lg font-bold mb-2">My Bookings</h3>
    <div id="myBookings"></div>
  </div>

  <!-- ADMIN -->
  <div id="adminPanel" class="max-w-md mx-auto mt-6 hidden">
    <h3 class="text-lg font-bold">Admin Dashboard</h3>
    <div id="allBookings"></div>
    <button onclick="logout()" class="w-full mt-3 bg-red-500 text-white p-2 rounded">Logout</button>
  </div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDs14OWNMCeO9h7u2MD6tz7TBG2IHKfZU0",
  authDomain: "hotel-booking-3b5ce.firebaseapp.com"
  projectId: "hotel-booking-3b5ce"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const OWNER_EMAIL = "lakshmikirankarpingari@gmail.com";

/* LOADING */
function showLoading() {
  document.getElementById("loading").style.display = "flex";
}
function hideLoading() {
  document.getElementById("loading").style.display = "none";
}

/* AUTH */
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("appPage").style.display = "block";

    if (user.email.toLowerCase() === OWNER_EMAIL.toLowerCase()) {
      document.getElementById("bookingSection").style.display = "none";
      document.getElementById("userBookingsSection").style.display = "none";
      document.getElementById("adminPanel").classList.remove("hidden");
      loadAllBookings();
    } else {
      document.getElementById("bookingSection").style.display = "block";
      document.getElementById("userBookingsSection").style.display = "block";
      document.getElementById("adminPanel").classList.add("hidden");
      loadMyBookings();
    }
  }
});

/* LOGIN */
function login() {
  showLoading();
  auth.signInWithEmailAndPassword(
    email.value.trim(),
    password.value.trim()
  ).finally(hideLoading);
}

/* SIGNUP */
function signup() {
  showLoading();
  auth.createUserWithEmailAndPassword(
    email.value.trim(),
    password.value.trim()
  ).finally(hideLoading);
}

/* LOGOUT */
function logout() {
  auth.signOut();
}

/* BOOK */
function bookRoom() {
  showLoading();

  db.collection("bookings").add({
    userId: auth.currentUser.uid,
    name: name.value,
    roomType: room.value,
    checkIn: checkIn.value,
    checkOut: checkOut.value,
    status: "pending"
  }).finally(hideLoading);
}

/* USER BOOKINGS */
function loadMyBookings() {
  db.collection("bookings")
    .where("userId", "==", auth.currentUser.uid)
    .onSnapshot(s => {
      let html = "";
      s.forEach(doc => {
        const d = doc.data();
        html += `<div class="bg-white p-2 mb-2 rounded shadow">
          ${d.roomType} | ${d.status}
        </div>`;
      });
      myBookings.innerHTML = html;
    });
}

/* ADMIN */
function loadAllBookings() {
  db.collection("bookings").onSnapshot(s => {
    let html = "";
    s.forEach(doc => {
      const d = doc.data();
      html += `<div class="bg-white p-2 mb-2 rounded shadow">
        ${d.name} - ${d.roomType} - ${d.status}
        <button onclick="accept('${doc.id}')">✅</button>
        <button onclick="reject('${doc.id}')">❌</button>
      </div>`;
    });
    allBookings.innerHTML = html;
  });
}

function accept(id) {
  db.collection("bookings").doc(id).update({status:"accepted"});
}
function reject(id) {
  db.collection("bookings").doc(id).update({status:"rejected"});
}
</script>

</body>
</html>
