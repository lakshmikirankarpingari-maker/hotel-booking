<!DOCTYPE html>
<html>
<head>
  <title>Sai Lakshmi Residency</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    .fade-in { animation: fade 0.5s ease-in; }
    @keyframes fade {
      from { opacity:0; transform: translateY(10px);}
      to { opacity:1; transform: translateY(0);}
    }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-100 to-purple-200">

<!-- LOADING -->
<div id="loading" class="fixed inset-0 bg-white flex items-center justify-center hidden z-50">
  <div class="animate-spin h-16 w-16 border-4 border-blue-500 border-t-transparent rounded-full"></div>
</div>

<!-- LOGIN -->
<div id="loginPage" class="min-h-screen flex items-center justify-center">
  <div class="bg-white p-6 rounded-xl shadow w-80 fade-in">
    <h2 class="text-xl font-bold mb-4 text-center">Login / Signup</h2>

    <input id="email" placeholder="Email" class="w-full mb-3 p-2 border rounded">
    <input id="password" type="password" placeholder="Password" class="w-full mb-3 p-2 border rounded">

    <button onclick="login()" class="w-full bg-blue-500 text-white p-2 rounded mb-2 hover:scale-105 transition">Login</button>
    <button onclick="signup()" class="w-full bg-green-500 text-white p-2 rounded hover:scale-105 transition">Signup</button>
  </div>
</div>

<!-- APP -->
<div id="appPage" style="display:none;">

  <!-- USER UI -->
  <div id="userUI">

    <!-- HEADER -->
    <div class="bg-gradient-to-r from-blue-600 to-purple-600 text-white p-6 text-center fade-in">
      <h1 class="text-3xl font-bold">🏨 Sai Lakshmi Residency</h1>
      <p>Clean • Hygienic • Family Friendly</p>
    </div>

    <!-- ROOMS -->
    <div class="p-4 grid grid-cols-1 sm:grid-cols-2 gap-4 fade-in">

      <div class="bg-white rounded-xl shadow overflow-hidden">
        <img src="https://lh3.googleusercontent.com/gps-cs-s/ANWiy9R5fqddFZ39svHGo1EondlVwCR-WzgRxu46HRzw9UemkL2Cktk4oXfhV43pG1z2P253SRs3CqiGXFADFEElTAjsSzjjT3nPy6ixl-K_I9Sazw2oelQiVjOfx85OzjvYOV7RF3yfLk3zoxjx=w224-h298-k-no"
             class="w-full h-48 object-cover">
        <div class="p-3"><b>Standard Room</b></div>
      </div>

      <div class="bg-white rounded-xl shadow overflow-hidden">
        <img src="https://lh3.googleusercontent.com/gps-cs-s/ANWiy9TKJ48pRFGTIpgv54C4tzTMNDA5fkQfL3ygOPXrs-1MipNj7NbjSj7sBJmkEMy2-VJKWBpkknxX9Riw2LIhp09AEH7ItTa_25nW4r64GBXDWkQrMEVu4iMSDK78Iso5WjyKilLJkQ=w529-h298-k-no"
             class="w-full h-48 object-cover">
        <div class="p-3"><b>Deluxe Room</b></div>
      </div>

    </div>

    <!-- BOOK -->
    <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow fade-in">
      <input id="name" placeholder="Name" class="w-full mb-2 p-2 border rounded">
      <input id="phone" placeholder="Phone" class="w-full mb-2 p-2 border rounded">

      <select id="room" class="w-full mb-2 p-2 border rounded">
        <option value="">Select Room</option>
        <option>Standard</option>
        <option>Deluxe</option>
      </select>

      <input type="date" id="checkIn" class="w-full mb-2 p-2 border rounded">
      <input type="date" id="checkOut" class="w-full mb-2 p-2 border rounded">

      <button onclick="bookRoom()" class="w-full bg-blue-600 text-white p-2 rounded hover:scale-105 transition">
        Book Now
      </button>

      <div id="bookingStatus" class="text-center mt-3 font-semibold"></div>
    </div>

    <!-- MY BOOKINGS -->
    <div class="max-w-md mx-auto mt-6 fade-in">
      <h3 class="font-bold mb-2">My Bookings</h3>
      <div id="myBookings"></div>
    </div>

  </div>

  <!-- ADMIN -->
  <div id="adminPanel" class="hidden p-4">
    <h2 class="text-xl font-bold mb-3">Admin Dashboard</h2>
    <div id="allBookings"></div>
  </div>

  <button onclick="logout()" class="fixed bottom-4 right-4 bg-red-500 text-white px-4 py-2 rounded">
    Logout
  </button>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDs14OWNMCeO9h7u2MD6tz7TBG2IHKfZU0",
  authDomain: "hotel-booking-3b5ce.firebaseapp.com",
  projectId: "hotel-booking-3b5ce"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const OWNER_EMAIL = "lakshmikirankarpingari@gmail.com";

/* AUTH */
auth.onAuthStateChanged(user=>{
  if(user){
    loginPage.style.display="none";
    appPage.style.display="block";

    if(user.email.toLowerCase()===OWNER_EMAIL.toLowerCase()){
      userUI.style.display="none";
      adminPanel.classList.remove("hidden");
      loadAllBookings();
    } else {
      userUI.style.display="block";
      adminPanel.classList.add("hidden");
      loadMyBookings();
    }
  }
});

/* LOGIN */
function login(){
  auth.signInWithEmailAndPassword(email.value,password.value)
  .catch(e=>alert(e.message));
}
function signup(){
  auth.createUserWithEmailAndPassword(email.value,password.value)
  .catch(e=>alert(e.message));
}

/* BOOK */
function bookRoom(){
  if(!name.value || !phone.value || !room.value || !checkIn.value || !checkOut.value){
    alert("Fill all fields"); return;
  }

  db.collection("bookings").add({
    userId: auth.currentUser.uid,
    name: name.value,
    phone: phone.value,
    room: room.value,
    checkIn: checkIn.value,
    checkOut: checkOut.value,
    status:"pending"
  }).then(()=>{
    bookingStatus.innerText="✅ Booking sent (Pending)";
    name.value=phone.value=room.value=checkIn.value=checkOut.value="";
  });
}

/* USER BOOKINGS */
function loadMyBookings(){
  db.collection("bookings")
  .where("userId","==",auth.currentUser.uid)
  .onSnapshot(s=>{
    let h="";
    s.forEach(d=>{
      let data=d.data();
      let color = data.status==="accepted"?"green":data.status==="rejected"?"red":"orange";

      h+=`<div class="bg-white p-2 mb-2 rounded shadow">
        ${data.room} (${data.checkIn})
        <span style="color:${color}; font-weight:bold">
          ${data.status}
        </span>
      </div>`;
    });
    myBookings.innerHTML=h;
  });
}

/* ADMIN */
function loadAllBookings(){
  db.collection("bookings").onSnapshot(s=>{
    let h="";
    s.forEach(d=>{
      let data=d.data();
      h+=`<div class="bg-white p-2 mb-2 rounded shadow">
        ${data.name} - ${data.room} - ${data.status}
        <button onclick="accept('${d.id}')">✔</button>
        <button onclick="reject('${d.id}')">✖</button>
      </div>`;
    });
    allBookings.innerHTML=h;
  });
}

function accept(id){db.collection("bookings").doc(id).update({status:"accepted"});}
function reject(id){db.collection("bookings").doc(id).update({status:"rejected"});}

function logout(){auth.signOut();}
</script>

</body>
</html>
