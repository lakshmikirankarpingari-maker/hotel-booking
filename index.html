<!DOCTYPE html>
<html>
<head>
<title>Hotel Booking</title>

<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body class="bg-gray-900 text-white p-4">

<h1 class="text-2xl mb-4 text-center">🏨 Sai Lakshmi Bookings</h1>

<!-- LOGIN -->
<div id="authBox" class="text-center">
  <input id="email" placeholder="Email" class="p-2 m-1 text-black">
  <input id="password" type="password" placeholder="Password" class="p-2 m-1 text-black">
  <br>
  <button onclick="signup()" class="bg-green-600 px-3 py-1 m-1">Signup</button>
  <button onclick="login()" class="bg-blue-600 px-3 py-1 m-1">Login</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

<button onclick="logout()" class="bg-red-600 px-3 py-1 mb-4">Logout</button>

<!-- USER BOOKING FORM -->
<div id="userView">

<h2 class="text-xl mb-2">Book Room</h2>

<input id="name" placeholder="Full Name" class="p-2 m-1 text-black w-full">
<input id="mobile" placeholder="Mobile Number" class="p-2 m-1 text-black w-full">
<input id="email2" placeholder="Email" class="p-2 m-1 text-black w-full">

<input id="checkin" type="date" class="p-2 m-1 text-black w-full">
<input id="checkout" type="date" class="p-2 m-1 text-black w-full">

<button onclick="bookRoom()" class="bg-green-600 px-4 py-2 mt-2">Book Now</button>

<h3 class="mt-4">My Bookings</h3>
<div id="myBookings"></div>

</div>

<!-- OWNER DASHBOARD -->
<div id="ownerView" class="hidden">
<h2 class="text-xl">Owner Dashboard</h2>
<div id="bookings"></div>
</div>

</div>

<script>

// 🔥 YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDs14OWNMCeO9h7u2MD6tz7TBG2IHKfZU0",
  authDomain: "hotel-booking-3b5ce.firebaseapp.com",
  projectId: "hotel-booking-3b5ce",
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

// SIGNUP
function signup(){
  auth.createUserWithEmailAndPassword(email.value, password.value)
  .then(()=> alert("Account created!"))
  .catch(e=>alert(e.message));
}

// LOGIN
function login(){
  auth.signInWithEmailAndPassword(email.value, password.value)
  .catch(e=>alert(e.message));
}

// LOGOUT
function logout(){
  auth.signOut();
}

// AUTH CHECK
auth.onAuthStateChanged(async (user)=>{
  if(user){
    authBox.style.display = "none";
    app.classList.remove("hidden");

    let snap = await db.collection("users")
      .where("email","==",user.email)
      .get();

    let isOwner = false;
    snap.forEach(doc=>{
      if(doc.data().role === "owner") isOwner = true;
    });

    if(isOwner){
      ownerView.classList.remove("hidden");
      userView.classList.add("hidden");
      loadBookings();
    } else {
      ownerView.classList.add("hidden");
      userView.classList.remove("hidden");
      loadMyBookings();
    }

  } else {
    authBox.style.display = "block";
    app.classList.add("hidden");
  }
});

// BOOK ROOM
function bookRoom(){
  db.collection("hotelBookings").add({
    user: auth.currentUser.email,
    name: name.value,
    mobile: mobile.value,
    email: email2.value,
    checkin: checkin.value,
    checkout: checkout.value,
    status: "pending"
  });

  alert("Booking Sent!");
}

// USER BOOKINGS
function loadMyBookings(){
  db.collection("hotelBookings")
  .where("user","==",auth.currentUser.email)
  .onSnapshot(snapshot=>{
    let html = "";
    snapshot.forEach(doc=>{
      let b = doc.data();
      html += `
        <div class="bg-gray-800 p-2 m-2">
          ${b.checkin} → ${b.checkout}<br>
          Status: ${b.status}
        </div>
      `;
    });
    myBookings.innerHTML = html;
  });
}

// OWNER BOOKINGS
function loadBookings(){
  db.collection("hotelBookings").onSnapshot(snapshot=>{
    let html = "";
    snapshot.forEach(doc=>{
      let b = doc.data();

      html += `
        <div class="bg-gray-800 p-2 m-2">
          ${b.user}<br>
          ${b.checkin} → ${b.checkout}<br>
          ${b.status}<br>

          <button onclick="approve('${doc.id}')" class="bg-green-600 px-2">Approve</button>
          <button onclick="reject('${doc.id}')" class="bg-red-600 px-2">Reject</button>
        </div>
      `;
    });
    bookings.innerHTML = html;
  });
}

function approve(id){
  db.collection("hotelBookings").doc(id).update({status:"approved"});
}

function reject(id){
  db.collection("hotelBookings").doc(id).update({status:"rejected"});
}

</script>

</body>
</html>
